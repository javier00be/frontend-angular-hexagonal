<!-- Recommended Products Section -->
<div class="bg-white py-12">
    <div class="max-w-[1800px] mx-auto px-4 md:px-8">
        <!-- Section Header -->
        <div class="flex justify-between items-center mb-4">
            <div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">{{ title }}</h2>
                <p class="text-gray-600">{{ subtitle }}</p>
            </div>
            <button *ngIf="showViewAllButton" (click)="onViewAllClick()"
                class="text-blue-600 hover:text-blue-700 font-semibold flex items-center gap-2 transition">
                Ver todos
                <i class="pi pi-arrow-right"></i>
            </button>
        </div>

        <!-- Products Carousel -->
        <div class="relative">
            <div class="overflow-x-auto pb-4 scrollbar-hide">
                <div class="flex gap-6" style="width: max-content;">
                    <div *ngFor="let product of displayProducts" class="w-[280px] flex-shrink-0">
                        <div
                            class="border border-gray-200 rounded-lg overflow-hidden flex flex-col h-full transition-all duration-200 hover:shadow-lg hover:-translate-y-1 bg-white">
                            <!-- Image -->
                            <div class="relative bg-gray-100">
                                <img [src]="product.imagen" [alt]="product.nombre"
                                    class="w-full h-[240px] object-cover" />
                                <div class="absolute top-3 right-3">
                                    <p-tag [value]="getStockLabel(product.cantidad)"
                                        [severity]="getStockSeverity(product.cantidad)"></p-tag>
                                </div>
                            </div>

                            <!-- Content -->
                            <div class="flex-1 flex flex-col gap-2 p-4">
                                <div class="font-semibold text-base line-clamp-2">{{ product.nombre }}</div>
                                <div class="flex items-center gap-1 text-xs">
                                    <i class="pi pi-star-fill text-orange-400"></i>
                                    <span class="text-gray-600">5.0</span>
                                </div>
                                <div class="text-xl font-bold text-gray-900 mt-auto">
                                    {{ formatCurrency(product.precio) }}
                                </div>
                                <button [routerLink]="['/productos', product.sku]"
                                    class="w-full bg-black text-white py-2 px-4 rounded-lg hover:bg-gray-800 transition font-medium text-sm">
                                    Ver Detalles
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="displayProducts.length === 0" class="text-center py-12">
            <i class="pi pi-box text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg">No hay productos recomendados disponibles</p>
        </div>
    </div>
</div>
