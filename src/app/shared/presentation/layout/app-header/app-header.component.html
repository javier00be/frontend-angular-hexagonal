<div class="header-container">
    <p-toolbar styleClass="!border-none">
        <ng-template pTemplate="start">
            <!-- Logo -->
            <div class="flex items-center gap-2 cursor-pointer" routerLink="/">
                <i class="pi pi-shopping-bag text-2xl text-white"></i>
                <span class="font-bold text-xl text-white">Bensam</span>
            </div>
        </ng-template>

        <ng-template pTemplate="center">
            <!-- Navigation Menu -->
            <div class="hidden md:flex items-center gap-8">
                <a routerLink="/" class="nav-link">Inicio</a>
                <a routerLink="/productos" class="nav-link">Shop</a>
                <a routerLink="/dashboard" class="nav-link">Dashboard</a>
            </div>
        </ng-template>

        <ng-template pTemplate="end">
            <!-- Action Icons -->
            <div class="flex items-center gap-4">
                <!-- Search Icon -->
                <button class="icon-button" pTooltip="Buscar">
                    <i class="pi pi-search"></i>
                </button>

                <!-- Cart Icon with Badge -->
                <button class="icon-button relative" routerLink="/carrito" pTooltip="Carrito">
                    <i class="pi pi-shopping-cart"></i>
                    <span class="cart-badge">2</span>
                </button>

                <!-- User Profile -->
                <button class="profile-button" (onClick)="loginPopover.toggle($event)">
                    <p-avatar icon="pi pi-user" shape="circle" size="normal"
                        styleClass="!bg-gray-200 !text-gray-700 dark:!bg-gray-700 dark:!text-gray-200">
                    </p-avatar>
                </button>
            </div>
        </ng-template>
    </p-toolbar>
</div>

<!-- Login Popover -->
<p-popover #loginPopover>
    <div class="w-80 p-2">
        <h3 class="text-lg text-center font-semibold mb-4 text-gray-900">Iniciar Sesión</h3>

        <!-- Email/Username Input -->
        <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                Email o Usuario
            </label>
            <input id="email" type="text" pInputText [(ngModel)]="loginEmail" placeholder="ejemplo@correo.com"
                class="w-full" />
        </div>

        <!-- Password Input -->
        <div class="mb-4">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                Contraseña
            </label>
            <p-password id="password" [(ngModel)]="loginPassword" [toggleMask]="true" [feedback]="false"
                placeholder="••••••••" styleClass="w-full" inputStyleClass="w-full">
            </p-password>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center">
                <input type="checkbox" id="remember" class="mr-2">
                <label for="remember" class="text-sm text-gray-600">Recordarme</label>
            </div>
            <a href="#" class="text-sm text-gray-600 hover:underline">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Login Button -->
        <p-button label="Iniciar Sesión" (onClick)="onLogin()" styleClass="w-full !bg-black !border-black !text-white"
            severity="secondary">
        </p-button>


        <!-- Register Link -->
        <div class="text-center mt-4">
            <span class="text-sm text-gray-600">¿No tienes cuenta? </span>
            <a href="#" class="text-sm text-gray-600 hover:underline font-semibold">Regístrate</a>
        </div>
    </div>
</p-popover>
